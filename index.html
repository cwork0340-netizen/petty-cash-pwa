<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="零用金" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>零用金管理</title>

  <style>
    :root {
      --vh: 1vh;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --bg: #f3f6f4;
      --card: #fff;
      --text: #17201f;
      --muted: #66746f;
      --blue: #0f766e;
      --blue-dark: #134e4a;
      --green: #15803d;
      --red: #b4232a;
      --amber: #b7791f;
      --line: #dce5e1;
      --tab-h: 84px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 20px;
      line-height: 1.35;
    }

    button, input, select, textarea { font: inherit; }

    #app {
      position: fixed;
      inset: 0;
      height: calc(var(--vh) * 100);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        linear-gradient(180deg, #fbfcfa, #f3f6f4 48%, #edf3f0);
      overflow: hidden;
    }

    .top-bar {
      min-height: 46px;
      padding: 8px 14px;
      padding-top: calc(8px + var(--safe-top));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #134e4a, #0f766e);
      font-size: 19px;
      font-weight: 1000;
      box-shadow: 0 4px 18px rgba(23,37,84,.18);
    }

    .content {
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 18px;
    }

    .page { display: none; }
    .page.active { display: block; animation: pageIn .16s ease-out; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 24px 20px 20px;
      margin-bottom: 14px;
      color: #fff;
      background:
        linear-gradient(135deg, #134e4a 0%, #0f766e 54%, #5aa99d 100%);
      box-shadow: 0 18px 42px rgba(30,41,59,.13);
      border: 1px solid rgba(255,255,255,.18);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255,255,255,.14), transparent 36%);
      pointer-events: none;
    }

    .hero-top, .hero-footer, .hero-meta-line, .balance-amount {
      position: relative;
      z-index: 1;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .hero-label { font-size: 24px; font-weight: 1000; }
    .hero-date {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .balance-amount {
      font-size: clamp(74px, 19vw, 96px);
      line-height: .96;
      font-weight: 1000;
      letter-spacing: -2.6px;
      margin: 6px 0 18px;
      text-shadow: 0 6px 18px rgba(15,23,42,.18);
    }

    .hero-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 10px 15px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 1000;
    }
    .badge-ok { background: rgba(236,253,245,.22); border: 1px solid rgba(187,247,208,.24); }
    .badge-warn { background: #fff7ed; color: #92400e; border: 1px solid rgba(251,191,36,.24); }

    .mini-update { color: rgba(255,255,255,.78); font-size: 16px; font-weight: 900; }

    .hero-meta-line {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 15px;
      font-weight: 850;
      color: rgba(255,255,255,.8);
    }

    .meta-pill {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.12);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .action-card {
      min-height: 96px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 14px;
      border: none;
      border-radius: 24px;
      padding: 18px 16px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(30,41,59,.08);
    }

    .action-card.primary { background: linear-gradient(135deg, #134e4a, #0f766e); }
    .action-card.success { background: linear-gradient(135deg, #166534, #4d8f65); }
    .action-card.settle { background: linear-gradient(135deg, #155e75, #2c8f8a); }
    .action-card.monthly { background: linear-gradient(135deg, #374151, #64748b); }
    .action-card.settings { background: linear-gradient(135deg, #334155, #6b7280); }

    .action-icon {
      grid-row: 1 / span 2;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255,255,255,.16);
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: 0;
    }

    .action-title { font-size: 25px; line-height: 1.12; font-weight: 1000; }
    .action-sub { margin-top: 4px; font-size: 16px; font-weight: 850; color: rgba(255,255,255,.8); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .summary-card {
      border-radius: 20px;
      padding: 14px 8px;
      text-align: center;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(226,232,240,.82);
      box-shadow: 0 6px 16px rgba(15,23,42,.055);
    }

    .summary-card:nth-child(1) { background: linear-gradient(180deg, #fff7f5, rgba(255,255,255,.92)); }
    .summary-card:nth-child(2) { background: linear-gradient(180deg, #f1f8f3, rgba(255,255,255,.92)); }
    .summary-card:nth-child(3) { background: linear-gradient(180deg, #eef8f7, rgba(255,255,255,.92)); }

    .summary-label { color: var(--muted); font-size: 15px; font-weight: 900; margin-bottom: 6px; }
    .summary-value { font-size: 22px; font-weight: 1000; }
    .red { color: var(--red); }
    .green { color: var(--green); }
    .blue { color: var(--blue); }

    .card {
      border-radius: 24px;
      padding: 17px 16px 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.92));
      border: 1px solid rgba(226,232,240,.78);
      box-shadow: 0 8px 22px rgba(30,41,59,.08);
      margin-bottom: 14px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-label {
      color: #1e293b;
      font-size: 22px;
      font-weight: 1000;
    }

    .section-label::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 22px;
      margin-right: 8px;
      border-radius: 999px;
      vertical-align: -4px;
      background: linear-gradient(180deg, var(--blue), #6aa99d);
    }

    .section-hint {
      color: var(--muted);
      font-size: 15px;
      font-weight: 850;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(241,245,249,.82);
      border: 1px solid rgba(226,232,240,.82);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 148px;
      border-radius: 22px;
      border: 1px dashed rgba(148,163,184,.35);
      background: linear-gradient(180deg, rgba(248,250,252,.72), rgba(255,255,255,.46));
      color: #94a3b8;
      text-align: center;
      font-size: 24px;
      font-weight: 1000;
    }

    .empty-state small {
      display: block;
      margin-top: 10px;
      color: #a8b3c4;
      font-size: 16px;
      font-weight: 800;
    }

    .record-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 17px 4px;
      border-bottom: 1px solid rgba(226,232,240,.72);
      border-radius: 14px;
    }
    .record-item:last-child { border-bottom: none; }

    .record-type { font-size: 23px; font-weight: 1000; line-height: 1.25; }
    .record-note { margin-top: 6px; color: var(--muted); font-size: 18px; font-weight: 800; }

    .record-amount-out, .record-amount-in {
      min-width: 112px;
      padding: 9px 10px;
      border-radius: 999px;
      text-align: right;
      font-size: 24px;
      font-weight: 1000;
      white-space: nowrap;
    }
    .record-amount-out { color: var(--red); background: #fff1f2; }
    .record-amount-in { color: var(--green); background: #ecfdf5; }

    .record-item.is-child, .status-item.is-child {
      margin-left: 16px;
      padding-left: 14px;
      border-left: 2px solid rgba(148,163,184,.6);
      border-bottom-style: dashed;
      background: rgba(148,163,184,.08);
      border-radius: 10px;
    }
    .record-item.is-child .record-type { font-size: 19px; }
    .record-item.is-child .record-note { font-size: 15px; }
    .record-item.is-child .record-amount-out,
    .record-item.is-child .record-amount-in { font-size: 19px; min-width: 92px; padding: 7px 8px; }
    .status-item.is-child .status-title { font-size: 16px; }
    .status-item.is-child .status-meta { font-size: 14px; }
    .status-item.is-child .status-money { font-size: 18px; }
    .child-link-icon { color: var(--muted); font-weight: 800; margin-right: 4px; }

    .status-list {
      display: grid;
      gap: 10px;
    }

    .status-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid rgba(226,232,240,.72);
    }
    .status-item:last-child { border-bottom: none; }

    .status-title { font-size: 20px; font-weight: 1000; line-height: 1.25; }
    .status-meta { margin-top: 5px; color: var(--muted); font-size: 16px; font-weight: 850; }
    .status-money { font-size: 22px; font-weight: 1000; white-space: nowrap; text-align: right; }

    .mini-btn {
      min-height: 48px;
      width: auto;
      padding: 8px 14px;
      border: none;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      font-size: 17px;
      font-weight: 1000;
      cursor: pointer;
    }

    .month-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .form-card, .money-section { padding: 18px; }
    .form-group { margin-bottom: 20px; }
    .form-group label, .coin-cell label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #334155;
      font-size: 21px;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .field-hint { color: #94a3b8; font-size: 15px; font-weight: 850; }

    input, select, textarea {
      width: 100%;
      min-height: 76px;
      padding: 18px;
      border-radius: 20px;
      border: 1.5px solid rgba(203,213,225,.92);
      background: linear-gradient(180deg, #fff, #fbfdff);
      color: var(--text);
      font-size: 26px;
      font-weight: 900;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 2px 8px rgba(15,23,42,.035);
    }

    textarea { min-height: 118px; resize: none; }

    input:focus, select:focus, textarea:focus {
      outline: 4px solid rgba(37,99,235,.13);
      border-color: #0f766e;
    }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-56%);
      color: #64748b;
      font-size: 30px;
      font-weight: 1000;
      pointer-events: none;
    }
    .select-wrap select { padding-right: 52px; }

    .btn {
      width: 100%;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 22px;
      color: #fff;
      font-size: 27px;
      font-weight: 1000;
      box-shadow: 0 10px 22px rgba(37,99,235,.15), inset 0 1px 0 rgba(255,255,255,.72);
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #134e4a, #0f766e); }
    .btn-success { background: linear-gradient(135deg, #166534, #4d8f65); }
    .btn:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; }

    .coin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .coin-cell label {
      justify-content: center;
      color: #475569;
      font-size: 19px;
    }

    .coin-cell input {
      min-height: 78px;
      text-align: center;
      font-size: 31px;
      border-radius: 22px;
    }

    .count-summary {
      position: sticky;
      bottom: 10px;
      z-index: 8;
      margin: 16px 0;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(148,163,184,.28);
      box-shadow: 0 -6px 26px rgba(15,23,42,.10);
      backdrop-filter: blur(16px);
    }

    .count-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .count-row.total {
      border-top: 1px dashed rgba(148,163,184,.45);
      margin-top: 8px;
      padding-top: 14px;
    }
    .count-row-label { color: #475569; font-size: 21px; font-weight: 900; }
    .count-row-value { font-size: 29px; font-weight: 1000; text-align: right; white-space: nowrap; }
    .diff-surplus { color: var(--blue); }
    .diff-short { color: var(--red); }
    .diff-ok { color: var(--green); }

    .tab-bar {
      min-height: calc(var(--tab-h) + var(--safe-bottom));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0 8px;
      padding-bottom: var(--safe-bottom);
      background: rgba(255,255,255,.96);
      border-top: 1px solid rgba(203,213,225,.72);
      box-shadow: 0 -10px 26px rgba(15,23,42,.09);
      backdrop-filter: blur(18px);
    }

    .tab-btn {
      min-height: var(--tab-h);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 1000;
      gap: 6px;
      cursor: pointer;
    }

    .tab-btn .icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 34px;
      border-radius: 999px;
      font-size: 26px;
    }
    .tab-btn.active { color: var(--blue); }
    .tab-btn.active .icon { background: #d9f0ec; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tab-h) + 20px + var(--safe-bottom));
      transform: translateX(-50%);
      display: none;
      max-width: calc(100vw - 32px);
      padding: 16px 22px;
      border-radius: 999px;
      background: rgba(15,23,42,.92);
      color: #fff;
      text-align: center;
      font-size: 21px;
      font-weight: 950;
      z-index: 99;
    }
    .toast.show { display: block; }



    .btn-secondary {
      background: linear-gradient(135deg, #334155, #64748b);
    }

    .settings-note {
      color: var(--muted);
      font-size: 16px;
      font-weight: 850;
      line-height: 1.45;
      margin: -4px 0 16px;
    }

    .database-card {
      background: linear-gradient(135deg, #1f2937, #475569);
    }

    @media (max-width: 375px) {
      .summary-grid { grid-template-columns: 1fr; }
      .summary-card {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        text-align: left;
        padding: 14px 16px;
      }
      .summary-label { margin-bottom: 0; font-size: 16px; }
      .summary-value { font-size: 23px; }
    }
  </style>
</head>

<body>
<div id="app">
  <div class="top-bar" id="topBarTitle">零用金管理</div>

  <main class="content" id="appContent">
    <section class="page active" id="page-home">
      <div id="homeContent">
        <div class="empty-state">載入中...</div>
      </div>
    </section>

    <section class="page" id="page-transaction">
      <div class="card form-card">
        <div class="section-title-row">
          <div class="section-label">拿錢 / 直接付款</div>
          <div class="section-hint">日常記錄</div>
        </div>

        <div class="form-group">
          <label for="txDate">日期</label>
          <input type="date" id="txDate" />
        </div>

        <div class="form-group">
          <label for="txType">動作類型</label>
          <div class="select-wrap">
            <select id="txType">
              <option value="取款">拿零用金（未結清）</option>
              <option value="實際支出">直接付款（已支出）</option>
              <option value="收入">補入零用金</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="txAmount">金額（元） <span class="field-hint">必填</span></label>
          <input type="number" id="txAmount" placeholder="例如：100" min="0" inputmode="numeric" />
        </div>

        <div class="form-group">
          <label for="txNote">用途</label>
          <input type="text" id="txNote" placeholder="例如：去郵局寄信、買清潔用品" />
        </div>

        <div class="form-group">
          <label for="txHandler">經手人</label>
          <div class="select-wrap">
            <select id="txHandler"></select>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="txSubmitBtn" onclick="submitTransaction()">送出記錄</button>
    </section>

    <section class="page" id="page-close">
      <div class="card form-card">
        <div class="section-title-row">
          <div class="section-label">報帳 / 還找零</div>
          <div class="section-hint">結清暫借</div>
        </div>
        <div class="settings-note">先選一筆未結清款項，再填實際支出與找零。系統會檢查「原拿款金額 = 實際支出 + 找零」。</div>

        <div class="form-group">
          <label for="closeWithdrawal">未結清款項</label>
          <div class="select-wrap">
            <select id="closeWithdrawal" onchange="previewCloseDiff()">
              <option value="">讀取中...</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="closeExpense">實際支出（元） <span class="field-hint">必填</span></label>
          <input type="number" id="closeExpense" placeholder="例如：80" min="0" inputmode="numeric" oninput="previewCloseDiff()" />
        </div>

        <div class="form-group">
          <label for="closeReturn">找零歸還（元） <span class="field-hint">必填，可填 0</span></label>
          <input type="number" id="closeReturn" placeholder="例如：20" min="0" inputmode="numeric" oninput="previewCloseDiff()" />
        </div>

        <div class="form-group">
          <label for="receiptStatus">收據狀態</label>
          <div class="select-wrap">
            <select id="receiptStatus">
              <option value="已收到">已收到</option>
              <option value="待補">待補</option>
              <option value="無需收據">無需收據</option>
            </select>
          </div>
        </div>

        <div class="count-row total">
          <span class="count-row-label">結案檢查</span>
          <span class="count-row-value" id="closeDiffDisplay">請先選款項</span>
        </div>
      </div>

      <div class="card" id="closeDiffNoteGroup" style="display:none;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="closeDiffNote">差異原因 <span class="field-hint">金額不符時必填</span></label>
          <textarea id="closeDiffNote" placeholder="例如：收據金額少 5 元、找零短少、用途拆分"></textarea>
        </div>
      </div>

      <button class="btn btn-primary" id="closeSubmitBtn" onclick="submitCloseWithdrawal()">送出結清</button>
    </section>

    <section class="page" id="page-inventory">
      <div class="card money-section">
        <div class="section-title-row">
          <div class="section-label">硬幣</div>
          <div class="section-hint">填數量</div>
        </div>
        <div class="coin-grid">
          <div class="coin-cell"><label>1 元</label><input type="number" class="coin-input" data-val="1" placeholder="0" min="0" inputmode="numeric" oninput="calcTotal()" /></div>

        <div class="coin-grid">

          <div class="coin-cell"><label>200 元</label><input type="number" class="bill-input" data-val="200" placeholder="0" min="0" inputmode="numeric" oninput="calcTotal()" /></div>

      <div class="count-summary">

        <div class="count-row"><span class="count-row-label">帳面餘額</span><span class="count-row-value" id="ledgerBalance">讀取中...</span></div>

        <div class="count-row total"><span class="count-row-label">盤點差異</span><span class="count-row-value" id="diffDisplay">—</span></div>

      <div class="card" id="diffNoteGroup" style="display:none;">

          <div class="coin-cell"><label>5 元</label><input type="number" id="setCoin5" placeholder="0" min="0" inputmode="numeric" /></div>
          <div class="coin-cell"><label>10 元</label><input type="number" id="setCoin10" placeholder="0" min="0" inputmode="numeric" /></div>
          <div class="coin-cell"><label>50 元</label><input type="number" id="setCoin50" placeholder="0" min="0" inputmode="numeric" /></div>

      <div class="card money-section">
        <div class="section-title-row">
          <div class="section-label">原始紙鈔數</div>

          <div class="coin-cell"><label>100 元</label><input type="number" id="setBill100" placeholder="0" min="0" inputmode="numeric" /></div>
          <div class="coin-cell"><label>200 元</label><input type="number" id="setBill200" placeholder="0" min="0" inputmode="numeric" /></div>
          <div class="coin-cell"><label>500 元</label><input type="number" id="setBill500" placeholder="0" min="0" inputmode="numeric" /></div>
          <div class="coin-cell"><label>1000 元</label><input type="number" id="setBill1000" placeholder="0" min="0" inputmode="numeric" /></div>

      <div class="card form-card">
        <div class="section-title-row">
          <div class="section-label">常用人員</div>
          <div class="section-hint">降低打字</div>
        </div>
        <div class="settings-note">每行一個名字。拿錢、報帳與月結會用同一套名稱，避免同一個人被拆成多種寫法。</div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="peopleSettings">人員名單</label>
          <textarea id="peopleSettings" placeholder="佳佳&#10;芯誼&#10;Bing"></textarea>
        </div>
      </div>

      <button class="btn btn-primary" id="settingsSubmitBtn" onclick="submitSettings()">儲存原始設定</button>
      <button class="btn btn-secondary" style="margin-top:12px;" onclick="submitPeopleSettings()">儲存常用人員</button>
      <button class="btn btn-secondary" style="margin-top:12px;" onclick="openDatabase()">開啟資料庫 / 試算表</button>
    </section>

    <section class="page" id="page-monthly">
      <div id="monthlyContent">
        <div class="empty-state">載入中...</div>
      </div>
    </section>

  </main>

  <nav class="tab-bar">
    <button class="tab-btn active" id="nav-home" onclick="switchPage('home')"><span class="icon">⌂</span>首頁</button>
    <button class="tab-btn" id="nav-transaction" onclick="switchPage('transaction')"><span class="icon">＋</span>拿錢</button>
    <button class="tab-btn" id="nav-close" onclick="switchPage('close')"><span class="icon">✓</span>結清</button>
    <button class="tab-btn" id="nav-inventory" onclick="switchPage('inventory')"><span class="icon">▦</span>盤點</button>
    <button class="tab-btn" id="nav-monthly" onclick="switchPage('monthly')"><span class="icon">□</span>月結</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = '/api/gas';
  const DATABASE_URL = 'https://docs.google.com/spreadsheets/d/1WjDwixtAbU7rywz-E83z3Bhflkhz4Iswvlek_NvSTI4/edit';

  function setAppHeight() {
    document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', setAppHeight);

  function $(id) { return document.getElementById(id); }

  var DEFAULT_PEOPLE = ['佳佳', '芯誼', 'Bing', 'Ivy', '秉哥', '黑貓', '詹姆士', 'Lalamove'];
  var peopleListCache = DEFAULT_PEOPLE.slice();

  function normalizePeople(list) {
    var seen = {};
    return (list || [])
      .map(function(name) { return String(name || '').trim(); })
      .filter(function(name) {
        if (!name || seen[name]) return false;
        seen[name] = true;
        return true;
      });
  }

  // 常用人員存在 Google Sheet 的「設定」分頁（key = people），
  // 所有裝置讀寫同一份，才不會各裝置各自一份導致同一人被拆成不同寫法。
  function loadPeopleList() {
    return api('getSettings')
      .then(function(settings) {
        var list = [];
        try { list = JSON.parse((settings && settings.people) || '[]'); } catch (err) { list = []; }
        peopleListCache = normalizePeople(list.length ? list : DEFAULT_PEOPLE);
        renderPeopleSelect();
        return peopleListCache;
      })
      .catch(function() {
        peopleListCache = DEFAULT_PEOPLE.slice();
        renderPeopleSelect();
        return peopleListCache;
      });
  }

  function renderPeopleSelect() {
    var el = $('txHandler');
    if (!el) return;
    var current = el.value;
    var people = peopleListCache;
    el.innerHTML = '<option value="">請選擇經手人</option>' + people.map(function(name) {
      return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
    }).join('');
    if (current && people.indexOf(current) !== -1) el.value = current;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function money(value) {
    return '$' + Number(value || 0).toLocaleString();
  }

  function listFromResponse(value) {
    if (Array.isArray(value)) return value;
    if (value && Array.isArray(value.items)) return value.items;
    if (value && Array.isArray(value.records)) return value.records;
    if (value && Array.isArray(value.transactions)) return value.transactions;
    if (value && Array.isArray(value.pending)) return value.pending;
    return [];
  }

  function getRecordAmount(record) {
    return Number(record.amount || record.withdrawAmount || record.originalAmount || record.total || 0);
  }

  function getRecordId(record, index) {
    return record.recordId || record.id || record.rowId || record.rowIndex || record.row || index;
  }

  function getRecordTitle(record) {
    return record.note || record.purpose || record.description || record.type || '未填用途';
  }

  function isPendingRecord(record) {
    var status = String(record.status || record.closeStatus || '').trim();
    var type = String(record.type || '').trim();
    // 找零歸還／收入／補入零用金是入帳性質，不是待報帳的借支，不該被算進未結清清單
    if (type === '找零歸還' || type === '收入' || type === '補入零用金') return false;
    if (status && status !== '已結清' && status !== '已核銷') return true;
    return type === '取款' || type === '拿零用金';
  }

  // 依 relatedId 把子紀錄（如找零歸還）緊接在父紀錄之後排序，
  // 找不到父紀錄的孤兒子紀錄則退回當作獨立主紀錄顯示。
  function groupByRelated(list) {
    list = list || [];
    var idSet = {};
    list.forEach(function(r, i) { idSet[getRecordId(r, i)] = true; });

    var childrenByParent = {};
    list.forEach(function(r) {
      var parentId = r.relatedId;
      if (parentId && idSet[parentId]) {
        (childrenByParent[parentId] = childrenByParent[parentId] || []).push(r);
      }
    });

    var ordered = [];
    list.forEach(function(r, i) {
      var id = getRecordId(r, i);
      var parentId = r.relatedId;
      if (parentId && idSet[parentId]) return; // 已經會掛在父紀錄底下，這裡跳過
      ordered.push({ record: r, isChild: false });
      (childrenByParent[id] || []).forEach(function(child) {
        ordered.push({ record: child, isChild: true });
      });
    });
    return ordered;
  }

  function todayText() {
    var d = new Date();
    return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
  }

  function fullDateValue() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todaySlashDate() {
    var d = new Date();
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
  }

  function showToast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
  }

  function api(action, params) {
    params = params || {};
    var query = new URLSearchParams(Object.assign({}, params, { action: action }));

    return fetch(API_URL + '?' + query.toString(), {
      cache: 'no-store'
    })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        if (data && data.success) return data.data;
        if (data && data.ok) return data.data;
        throw new Error(data && data.error ? data.error : 'API 錯誤');
      });
  }

  function switchPage(page) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    $('page-' + page).classList.add('active');
    if ($('nav-' + page)) $('nav-' + page).classList.add('active');

    $('topBarTitle').textContent = {
      home: '零用金管理',
      transaction: '拿錢 / 直接付款',
      close: '報帳 / 還找零',
      inventory: '每日盤點',
      settings: '設定與資料庫',
      monthly: '月底清算'
    }[page];

    $('appContent').scrollTop = 0;
    if (page === 'transaction') initTransactionForm();
    if (page === 'close') initCloseForm();
    if (page === 'inventory') initInventoryForm();
    if (page === 'settings') initSettingsForm();
    if (page === 'monthly') loadMonthly();
  }

  function calcRecentSummary(recent) {
    var out = 0, income = 0;
    (recent || []).forEach(function(r) {
      var amount = Number(r.amount || 0);
      if (r.type === '取款' || r.type === '實際支出') out += amount;
      if (r.type === '找零歸還' || r.type === '收入') income += amount;
    });
    return { out: out, income: income, count: (recent || []).length };
  }

  function loadHome() {
    $('homeContent').innerHTML = '<div class="empty-state">載入中...</div>';
    api('getHomeData')
      .then(renderHome)
      .catch(function(err) {
        $('homeContent').innerHTML = '<div class="card"><div class="empty-state">載入失敗<small>' + escapeHtml(err.message) + '</small></div></div>';
      });
  }

  function renderHome(data) {
    data = data || {};
    var recent = data.recent || [];
    var summary = calcRecentSummary(recent);

    var badgeHtml = data.todayDone
      ? '<span class="badge badge-ok">✓ 今日已盤點</span>'
      : '<span class="badge badge-warn">⚠ 今日未盤點</span>';

    var recordsHtml = '';
    if (!recent.length) {
      recordsHtml = '<div class="empty-state">尚無記錄<small>可以先新增一筆收支，開始建立流水帳</small></div>';
    } else {
      groupByRelated(recent).forEach(function(entry) {
        var r = entry.record;
        var isOut = r.type === '取款' || r.type === '實際支出';
        recordsHtml +=
          '<div class="record-item' + (entry.isChild ? ' is-child' : '') + '">' +
            '<div>' +
              '<div class="record-type">' + (entry.isChild ? '<span class="child-link-icon">↳</span>' : '') + escapeHtml(r.type) + (r.note ? '｜' + escapeHtml(r.note) : '') + '</div>' +
              '<div class="record-note">' + escapeHtml(r.date) + (r.handler ? '　' + escapeHtml(r.handler) : '') + '</div>' +
            '</div>' +
            '<div class="' + (isOut ? 'record-amount-out' : 'record-amount-in') + '">' + (isOut ? '－' : '＋') + money(r.amount) + '</div>' +
          '</div>';
      });
    }

    $('homeContent').innerHTML =
      '<div class="hero-card">' +
        '<div class="hero-top"><div class="hero-label">帳面餘額</div><div class="hero-date">今日 ' + todayText() + '</div></div>' +
        '<div class="balance-amount">' + money(data.balance) + '</div>' +
        '<div class="hero-footer">' + badgeHtml + '<div class="mini-update">最近 5 筆快速摘要</div></div>' +
        '<div class="hero-meta-line"><span class="meta-pill">最後更新：' + escapeHtml(data.lastUpdated || '尚無更新時間') + '</span></div>' +
      '</div>' +

      '<div class="action-grid">' +
        '<button class="action-card primary" onclick="switchPage(&quot;transaction&quot;)"><span class="action-icon">＋</span><span class="action-title">我要拿零用金</span><span class="action-sub">建立待結清取款</span></button>' +
        '<button class="action-card settle" onclick="switchPage(&quot;close&quot;)"><span class="action-icon">✓</span><span class="action-title">我要報帳 / 結清</span><span class="action-sub">填實際支出、找零與收據</span></button>' +
        '<button class="action-card success" onclick="switchPage(&quot;inventory&quot;)"><span class="action-icon">▦</span><span class="action-title">盤點現金</span><span class="action-sub">硬幣、紙鈔快速填</span></button>' +
        '<button class="action-card monthly" onclick="switchPage(&quot;monthly&quot;)"><span class="action-icon">□</span><span class="action-title">月底清算</span><span class="action-sub">檢查未結款、收據、差異</span></button>' +
        '<button class="action-card database-card" onclick="openDatabase()"><span class="action-icon">≡</span><span class="action-title">開啟資料庫</span><span class="action-sub">查看 Google Sheet</span></button>' +
        '<button class="action-card settings" onclick="switchPage(&quot;settings&quot;)"><span class="action-icon">⚙</span><span class="action-title">原始設定</span><span class="action-sub">金額、鈔票硬幣、人員</span></button>' +
      '</div>' +

      '<div class="summary-grid">' +
        '<div class="summary-card"><div class="summary-label">最近支出</div><div class="summary-value red">' + money(summary.out) + '</div></div>' +
        '<div class="summary-card"><div class="summary-label">最近收入</div><div class="summary-value green">' + money(summary.income) + '</div></div>' +
        '<div class="summary-card"><div class="summary-label">記錄筆數</div><div class="summary-value blue">' + summary.count + '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="section-title-row"><div class="section-label">未結清款項</div><div class="section-hint">月底必查</div></div>' +
        '<div id="pendingHomeList"><div class="empty-state">讀取中...</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="section-title-row"><div class="section-label">最近記錄</div><div class="section-hint">最新 5 筆</div></div>' +
        recordsHtml +
      '</div>';

    loadPendingHome();
  }

  function renderPendingList(list, options) {
    options = options || {};
    if (!list.length) {
      return '<div class="empty-state">目前沒有未結清款項<small>月底清算時這裡應該保持為空</small></div>';
    }

    var html = '<div class="status-list">';
    groupByRelated(list).forEach(function(entry, index) {
      var r = entry.record;
      var id = getRecordId(r, index);
      html +=
        '<div class="status-item' + (entry.isChild ? ' is-child' : '') + '">' +
          '<div>' +
            '<div class="status-title">' + (entry.isChild ? '<span class="child-link-icon">↳</span>' : '') + escapeHtml(getRecordTitle(r)) + '</div>' +
            '<div class="status-meta">' + escapeHtml(r.date || '') + (r.handler ? '　' + escapeHtml(r.handler) : '') + '　狀態：' + escapeHtml(r.status || '未結清') + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="status-money red">' + money(getRecordAmount(r)) + '</div>' +
            (options.withButton && !entry.isChild ? '<button class="mini-btn" onclick="startCloseFromHome(&quot;' + escapeHtml(id) + '&quot;)">報帳</button>' : '') +
          '</div>' +
        '</div>';
    });
    return html + '</div>';
  }

  function loadPendingWithdrawals() {
    return api('getPendingWithdrawals')
      .then(function(data) {
        return listFromResponse(data).filter(isPendingRecord);
      });
  }

  function loadPendingHome() {
    var el = $('pendingHomeList');
    if (!el) return;

    loadPendingWithdrawals()
      .then(function(list) {
        el.innerHTML = renderPendingList(list.slice(0, 5), { withButton: true });
      })
      .catch(function() {
        el.innerHTML = '<div class="empty-state">未結清清單尚未連線<small>目前仍可記帳；月底請先用資料庫核對取款紀錄</small></div>';
      });
  }

  function initTransactionForm() {
    renderPeopleSelect();
    loadPeopleList();
    if (!$('txDate').value) $('txDate').value = fullDateValue();
  }

  function submitTransaction() {
    var date = $('txDate').value;
    var type = $('txType').value;
    var amount = parseFloat($('txAmount').value);
    var note = $('txNote').value.trim();
    var handler = $('txHandler').value.trim();

    if (!date) { showToast('請選擇日期'); return; }
    if (isNaN(amount) || amount <= 0) { showToast('請填寫正確金額'); return; }
    if (!note) note = '未填用途';
    if (!handler) handler = '未填經手人';

    var btn = $('txSubmitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    api('addTransaction', {
      date: date.replace(/-/g, '/'),
      type: type,
      amount: amount,
      note: type === '取款' ? note + '｜狀態：未結清' : note,
      handler: handler
    }).then(function(result) {
      btn.disabled = false;
      btn.textContent = '送出記錄';
      $('txAmount').value = '';
      $('txNote').value = '';
      showToast('已記錄，餘額 ' + money(result.newBalance));
      loadHome();
      setTimeout(function() { switchPage('home'); }, 650);
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = '送出記錄';
      showToast(err.message || '送出失敗');
    });
  }

  var _pendingWithdrawals = [];
  var _closeTargetId = '';

  function startCloseFromHome(id) {
    _closeTargetId = String(id);
    switchPage('close');
  }

  function initCloseForm() {
    var select = $('closeWithdrawal');
    var btn = $('closeSubmitBtn');
    select.innerHTML = '<option value="">讀取中...</option>';
    btn.disabled = true;
    btn.textContent = '讀取未結款...';

    loadPendingWithdrawals()
      .then(function(list) {
        _pendingWithdrawals = list;
        if (!list.length) {
          select.innerHTML = '<option value="">目前沒有未結清款項</option>';
          btn.disabled = true;
          btn.textContent = '沒有可結清款項';
          previewCloseDiff();
          return;
        }

        select.innerHTML = list.map(function(r, index) {
          var id = String(getRecordId(r, index));
          return '<option value="' + escapeHtml(id) + '">' + escapeHtml(r.date || '') + '｜' + escapeHtml(r.handler || '未填經手人') + '｜' + escapeHtml(getRecordTitle(r)) + '｜' + money(getRecordAmount(r)) + '</option>';
        }).join('');

        if (_closeTargetId) {
          select.value = _closeTargetId;
          _closeTargetId = '';
        }

        btn.disabled = false;
        btn.textContent = '送出結清';
        previewCloseDiff();
      })
      .catch(function(err) {
        _pendingWithdrawals = [];
        select.innerHTML = '<option value="">未結清 API 尚未可用</option>';
        btn.disabled = true;
        btn.textContent = '請先從資料庫核對';
        $('closeDiffDisplay').textContent = '需要補後端未結清清單';
        showToast(err.message || '未結清清單讀取失敗');
      });
  }

  function getSelectedWithdrawal() {
    var id = String($('closeWithdrawal').value || '');
    for (var i = 0; i < _pendingWithdrawals.length; i++) {
      if (String(getRecordId(_pendingWithdrawals[i], i)) === id) return _pendingWithdrawals[i];
    }
    return null;
  }

  function previewCloseDiff() {
    var target = getSelectedWithdrawal();
    var display = $('closeDiffDisplay');
    var noteGroup = $('closeDiffNoteGroup');
    if (!target) {
      display.textContent = '請先選款項';
      display.className = 'count-row-value';
      noteGroup.style.display = 'none';
      return;
    }

    var borrowed = getRecordAmount(target);
    var expense = parseFloat($('closeExpense').value) || 0;
    var returned = parseFloat($('closeReturn').value) || 0;
    var diff = borrowed - expense - returned;

    if (diff === 0) {
      display.textContent = '相符，可結清';
      display.className = 'count-row-value diff-ok';
      noteGroup.style.display = 'none';
    } else {
      display.textContent = (diff > 0 ? '尚差 ' : '超出 ') + money(Math.abs(diff));
      display.className = 'count-row-value diff-short';
      noteGroup.style.display = 'block';
    }
  }

  function submitCloseWithdrawal() {
    var target = getSelectedWithdrawal();
    if (!target) { showToast('請選擇未結清款項'); return; }

    var borrowed = getRecordAmount(target);
    var expense = parseFloat($('closeExpense').value);
    var returned = parseFloat($('closeReturn').value);
    var receiptStatus = $('receiptStatus').value;
    var diffNote = $('closeDiffNote').value.trim();
    var diff = borrowed - (expense || 0) - (returned || 0);

    if (isNaN(expense) || expense < 0) { showToast('請填寫正確實際支出'); return; }
    if (isNaN(returned) || returned < 0) { showToast('請填寫正確找零金額，可填 0'); return; }
    if (diff !== 0 && !diffNote) { showToast('金額不符時請填差異原因'); return; }

    var btn = $('closeSubmitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    var recordLabel = getRecordTitle(target);
    var commonNote = '結清：' + recordLabel + '｜原拿款：' + borrowed + '｜實支：' + expense + '｜找零：' + returned + '｜收據：' + receiptStatus + (diffNote ? '｜差異：' + diffNote : '');
    var handler = target.handler || '';

    var closeParams = {
      id: getRecordId(target, 0),
      recordId: getRecordId(target, 0),
      row: target.row || target.rowIndex || '',
      date: todaySlashDate(),
      actualExpense: expense,
      returnedAmount: returned,
      receiptStatus: receiptStatus,
      diffAmount: diff,
      diffNote: diffNote,
      note: commonNote,
      handler: handler,
      status: diff === 0 ? (receiptStatus === '待補' ? '待補收據' : '已結清') : '待查差異'
    };

    api('closeWithdrawal', closeParams)
      .then(function() {
        return Promise.resolve([]);
      })
      .then(function() {
        btn.disabled = false;
        btn.textContent = '送出結清';
        $('closeExpense').value = '';
        $('closeReturn').value = '';
        $('closeDiffNote').value = '';
        showToast(receiptStatus === '待補' ? '已記錄，收據待補' : '已記錄結清資料');
        loadHome();
        initCloseForm();
        setTimeout(function() { switchPage('home'); }, 800);
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = '送出結清';
        showToast(err.message || '結清功能尚未完成，未寫入任何資料');
      });
  }

  var _ledgerBalance = null;
  var _pendingInventoryAmount = 0;

  function initInventoryForm() {
    var btn = $('invSubmitBtn');
    btn.disabled = true;
    btn.textContent = '讀取餘額中...';
    $('ledgerBalance').textContent = '讀取中...';
    $('pendingInventoryTotal').textContent = '讀取中...';
    $('diffDisplay').textContent = '—';

    loadPendingWithdrawals()
      .then(function(list) {
        _pendingInventoryAmount = list.reduce(function(sum, r) { return sum + getRecordAmount(r); }, 0);
        $('pendingInventoryTotal').textContent = money(_pendingInventoryAmount);
      })
      .catch(function() {
        _pendingInventoryAmount = 0;
        $('pendingInventoryTotal').textContent = '未連線';
      });

    api('getBalance')
      .then(function(balance) {
        _ledgerBalance = Number(balance || 0);
        $('ledgerBalance').textContent = money(_ledgerBalance);
        btn.disabled = false;
        btn.textContent = '送出盤點';
        calcTotal();
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = '重新讀取後再送出';
        $('ledgerBalance').textContent = '讀取失敗';
        showToast(err.message || '餘額讀取失敗');
      });
  }

  function calcTotal() {
    var total = 0;
    document.querySelectorAll('.coin-input, .bill-input').forEach(function(el) {
      total += (parseFloat(el.value) || 0) * parseFloat(el.dataset.val);
    });

    $('actualTotalDisplay').textContent = money(total);

    if (_ledgerBalance === null) {
      $('diffDisplay').textContent = '等待讀取...';
      return;
    }

    var diff = total - _ledgerBalance;
    var diffEl = $('diffDisplay');
    var noteGroup = $('diffNoteGroup');

    if (diff === 0) {
      diffEl.textContent = '±$0 相符 ✓';
      diffEl.className = 'count-row-value diff-ok';
      noteGroup.style.display = 'none';
    } else if (diff > 0) {
      diffEl.textContent = '＋' + money(diff) + ' 溢';
      diffEl.className = 'count-row-value diff-surplus';
      noteGroup.style.display = 'block';
    } else {
      diffEl.textContent = '－' + money(Math.abs(diff)) + ' 短';
      diffEl.className = 'count-row-value diff-short';
      noteGroup.style.display = 'block';
    }
  }

  function getCoinBillValues() {
    var c = document.querySelectorAll('.coin-input');
    var b = document.querySelectorAll('.bill-input');
    return {
      coin1: parseFloat(c[0].value) || 0,
      coin5: parseFloat(c[1].value) || 0,
      coin10: parseFloat(c[2].value) || 0,
      coin50: parseFloat(c[3].value) || 0,
      bill100: parseFloat(b[0].value) || 0,
      bill200: parseFloat(b[1].value) || 0,
      bill500: parseFloat(b[2].value) || 0,
      bill1000: parseFloat(b[3].value) || 0
    };
  }

  function submitInventory() {
    if (_ledgerBalance === null) { showToast('請先等待帳面餘額讀取完成'); return; }

    var vals = getCoinBillValues();
    var actualTotal =
      vals.coin1 * 1 + vals.coin5 * 5 + vals.coin10 * 10 + vals.coin50 * 50 +
      vals.bill100 * 100 + vals.bill200 * 200 + vals.bill500 * 500 + vals.bill1000 * 1000;

    var diff = actualTotal - _ledgerBalance;
    var diffNote = $('diffNote').value.trim();

    if (diff !== 0 && !diffNote) {
      showToast('有差異時請填寫差異原因');
      return;
    }

    var btn = $('invSubmitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    api('addInventory', Object.assign({}, vals, {
      date: todaySlashDate(),
      actualTotal: actualTotal,
      diffNote: diffNote
    })).then(function(result) {
      btn.disabled = false;
      btn.textContent = '送出盤點';
      showToast(diff === 0 ? '盤點完成，帳面相符' : '盤點完成，差異已記錄');

      document.querySelectorAll('.coin-input, .bill-input').forEach(function(el) { el.value = ''; });
      $('diffNote').value = '';

      _ledgerBalance = Number(result.newBalance || 0);
      $('ledgerBalance').textContent = money(_ledgerBalance);
      calcTotal();
      loadHome();
      setTimeout(function() { switchPage('home'); }, 700);
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = '送出盤點';
      showToast(err.message || '送出失敗');
    });
  }

  function safeApi(action, fallback) {
    return api(action).catch(function() { return fallback; });
  }

  function loadMonthly() {
    $('monthlyContent').innerHTML = '<div class="empty-state">載入中...</div>';

    Promise.all([
      safeApi('getBalance', 0),
      safeApi('getSettings', {}),
      loadPendingWithdrawals().catch(function() { return null; }),
      safeApi('getAllTransactions', null)
    ]).then(function(results) {
      var balance = Number(results[0] || 0);
      var settings = results[1] || {};
      var pending = results[2];
      var transactions = results[3] == null ? null : listFromResponse(results[3]);
      renderMonthly(balance, settings, pending, transactions);
    }).catch(function(err) {
      $('monthlyContent').innerHTML = '<div class="card"><div class="empty-state">月結資料載入失敗<small>' + escapeHtml(err.message) + '</small></div></div>';
    });
  }

  function renderMonthly(balance, settings, pending, transactions) {
    var pendingList = pending || [];
    var pendingTotal = pendingList.reduce(function(sum, r) { return sum + getRecordAmount(r); }, 0);
    var initialAmount = Number(settings.initialAmount || settings.originalAmount || 0);

    var receiptPending = [];
    var diffPending = [];
    if (transactions) {
      receiptPending = transactions.filter(function(r) {
        return String(r.receiptStatus || r.note || '').indexOf('待補') >= 0;
      });
      diffPending = transactions.filter(function(r) {
        var text = String(r.status || r.diffNote || r.note || '');
        return text.indexOf('待查') >= 0 || text.indexOf('差異') >= 0 || Number(r.diffAmount || 0) !== 0;
      });
    }

    var pendingBlock = pending === null
      ? '<div class="empty-state">未結清清單尚未連線<small>請開啟資料庫檢查所有取款紀錄</small></div>'
      : renderPendingList(pendingList, { withButton: true });

    var receiptBlock = transactions === null
      ? '<div class="empty-state">待補收據清單尚未連線<small>後端需提供 getAllTransactions 或收據欄位</small></div>'
      : renderSimpleAuditList(receiptPending, '目前沒有待補收據');

    var diffBlock = transactions === null
      ? '<div class="empty-state">差異清單尚未連線<small>後端需提供盤點差異或交易狀態欄位</small></div>'
      : renderSimpleAuditList(diffPending, '目前沒有待查差異');

    $('monthlyContent').innerHTML =
      '<div class="hero-card">' +
        '<div class="hero-top"><div class="hero-label">月底清算</div><div class="hero-date">' + todayText() + '</div></div>' +
        '<div class="balance-amount">' + money(balance) + '</div>' +
        '<div class="hero-footer"><span class="badge ' + (pendingList.length ? 'badge-warn' : 'badge-ok') + '">' + (pendingList.length ? '有未結清款項' : '未結清為 0') + '</span><div class="mini-update">清算前先處理下面三張清單</div></div>' +
        '<div class="hero-meta-line"><span class="meta-pill">期初金額：' + money(initialAmount) + '</span><span class="meta-pill">未結清總額：' + money(pendingTotal) + '</span></div>' +
      '</div>' +

      '<div class="summary-grid">' +
        '<div class="summary-card"><div class="summary-label">帳面餘額</div><div class="summary-value blue">' + money(balance) + '</div></div>' +
        '<div class="summary-card"><div class="summary-label">未結款</div><div class="summary-value red">' + money(pendingTotal) + '</div></div>' +
        '<div class="summary-card"><div class="summary-label">待補收據</div><div class="summary-value red">' + (transactions ? receiptPending.length : '-') + '</div></div>' +
        '<div class="summary-card"><div class="summary-label">待查差異</div><div class="summary-value red">' + (transactions ? diffPending.length : '-') + '</div></div>' +
      '</div>' +

      '<div class="card"><div class="section-title-row"><div class="section-label">1. 未結清款項</div><div class="section-hint">錢在誰那裡</div></div>' + pendingBlock + '</div>' +
      '<div class="card"><div class="section-title-row"><div class="section-label">2. 待補收據</div><div class="section-hint">月底必補</div></div>' + receiptBlock + '</div>' +
      '<div class="card"><div class="section-title-row"><div class="section-label">3. 盤點差異</div><div class="section-hint">待查 / 已調整</div></div>' + diffBlock + '</div>' +
      '<button class="btn btn-secondary" onclick="openDatabase()">開啟資料庫核對明細</button>';
  }

  function renderSimpleAuditList(list, emptyText) {
    if (!list.length) {
      return '<div class="empty-state">' + escapeHtml(emptyText) + '<small>月結前這裡應該保持為空</small></div>';
    }

    var html = '<div class="status-list">';
    groupByRelated(list.slice(0, 20)).forEach(function(entry) {
      var r = entry.record;
      html +=
        '<div class="status-item' + (entry.isChild ? ' is-child' : '') + '">' +
          '<div>' +
            '<div class="status-title">' + (entry.isChild ? '<span class="child-link-icon">↳</span>' : '') + escapeHtml(getRecordTitle(r)) + '</div>' +
            '<div class="status-meta">' + escapeHtml(r.date || '') + (r.handler ? '　' + escapeHtml(r.handler) : '') + '　' + escapeHtml(r.status || r.receiptStatus || '') + '</div>' +
          '</div>' +
          '<div class="status-money">' + money(getRecordAmount(r)) + '</div>' +
        '</div>';
    });
    return html + '</div>';
  }


  function openDatabase() {
    window.open(DATABASE_URL, '_blank', 'noopener,noreferrer');
  }

  function setValue(id, value) {
    var el = $(id);
    if (el) el.value = value == null ? '' : value;
  }

  function getNumberValue(id) {
    var el = $(id);
    return el ? (parseFloat(el.value) || 0) : 0;
  }

  function initSettingsForm() {
    renderPeopleSelect();

    var btn = $('settingsSubmitBtn');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '讀取設定中...';
    }

    api('getSettings')
      .then(function(settings) {
        settings = settings || {};

        setValue('settingOriginalAmount', settings.initialAmount || settings.originalAmount || 0);
        setValue('setCoin1', settings.coin1 || 0);
        setValue('setCoin5', settings.coin5 || 0);
        setValue('setCoin10', settings.coin10 || 0);
        setValue('setCoin50', settings.coin50 || 0);
        setValue('setBill100', settings.bill100 || 0);
        setValue('setBill200', settings.bill200 || 0);
        setValue('setBill500', settings.bill500 || 0);
        setValue('setBill1000', settings.bill1000 || 0);

        var peopleRaw = [];
        try { peopleRaw = JSON.parse(settings.people || '[]'); } catch (err) { peopleRaw = []; }
        peopleListCache = normalizePeople(peopleRaw.length ? peopleRaw : DEFAULT_PEOPLE);
        renderPeopleSelect();
        if ($('peopleSettings')) $('peopleSettings').value = peopleListCache.join('\n');

        if (btn) {
          btn.disabled = false;
          btn.textContent = '儲存原始設定';
        }
      })
      .catch(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '儲存原始設定';
        }
      showToast(err.message || '設定讀取失敗');
    });
  }

  function submitPeopleSettings() {
    var el = $('peopleSettings');
    if (!el) return;
    var list = normalizePeople(el.value.split(/\r?\n|,/));
    if (!list.length) {
      showToast('請至少保留一位常用人員');
      return;
    }

    api('savePeopleSettings', { people: JSON.stringify(list) })
      .then(function(result) {
        peopleListCache = normalizePeople((result && result.people) || list);
        renderPeopleSelect();
        el.value = peopleListCache.join('\n');
        showToast('常用人員已儲存');
      })
      .catch(function(err) {
        showToast(err.message || '常用人員儲存失敗');
      });
  }

  function submitSettings() {
    var btn = $('settingsSubmitBtn');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '儲存中...';
    }

    api('saveSettings', {
      initialAmount: getNumberValue('settingOriginalAmount'),
      coin1: getNumberValue('setCoin1'),
      coin5: getNumberValue('setCoin5'),
      coin10: getNumberValue('setCoin10'),
      coin50: getNumberValue('setCoin50'),
      bill100: getNumberValue('setBill100'),
      bill200: getNumberValue('setBill200'),
      bill500: getNumberValue('setBill500'),
      bill1000: getNumberValue('setBill1000')
    })
      .then(function(result) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '儲存原始設定';
        }

        showToast('原始設定已儲存，餘額 ' + money(result.newBalance || result.balance || 0));

        loadHome();

        setTimeout(function() {
          switchPage('home');
        }, 700);
      })
      .catch(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '儲存原始設定';
        }
        showToast(err.message || '儲存失敗');
      });
  }


  window.addEventListener('load', loadHome);

  // 先停用舊 Service Worker，避免手機一直吃到舊版快取。
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      }).catch(function() {});
    });
  }
</script>
</body>
</html>
